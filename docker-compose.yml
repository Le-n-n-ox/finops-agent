services:
  finops_agent:
    build: .
    container_name: finops_agent
    ports:
      - "8000:8000"
    environment:
      - AGENT_RUNTIME=${AGENT_RUNTIME:-local}
      - METERLESS_BASE_URL=${METERLESS_BASE_URL:-http://host.docker.internal:8088/v1}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - DATA_SOURCE=${DATA_SOURCE:-local}
      - ZETARIS_BASE_URL=${ZETARIS_BASE_URL}
      - ZETARIS_ORG_ID=${ZETARIS_ORG_ID}
      - ZETARIS_USERNAME=${ZETARIS_USERNAME}
      - ZETARIS_PASSWORD=${ZETARIS_PASSWORD}
      - ZETARIS_API_KEY=${ZETARIS_API_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finops_frontend
    ports:
      - "5173:5173"
    environment:
      - API_PROXY_TARGET=http://finops_agent:8000
    depends_on:
      - finops_agent
    restart: unless-stopped
